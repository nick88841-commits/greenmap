<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綠色足跡地圖 - 足跡紀錄器</title>
    
    <!-- PWA 與手機原生 APP 支援 Meta 標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="綠色足跡">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#22c55e">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/22c55e/ffffff?text=%E8%B6%B3%E8%B7%A1">
    
    <!-- Tailwind CSS & FontAwesome & Leaflet CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.12);
        }

        /* Google Maps 風格定位點 */
        .gmap-user-container {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .gmap-user-dot {
            width: 16px;
            height: 16px;
            background-color: #22c55e;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            z-index: 2;
        }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
        }
        .leaflet-control-zoom a {
            border-radius: 12px !important;
            color: #334155 !important;
            background: rgba(255,255,255,0.9) !important;
        }

        .custom-footprint-popup .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 4px;
        }
        .custom-footprint-popup .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.92);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 頂部資訊列 -->
    <div class="fixed top-3 left-3 right-3 z-20 flex flex-col space-y-2 pointer-events-none">
        <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between pointer-events-auto shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="relative flex items-center justify-center">
                    <span id="gps-pulse-indicator" class="w-3.5 h-3.5 bg-emerald-500 rounded-full block"></span>
                </div>
                <div>
                    <h1 class="font-black text-sm text-slate-800 tracking-wide flex items-center space-x-1.5">
                        <span>綠色足跡</span>
                        <span id="gps-status-badge" class="bg-slate-200 text-slate-600 text-[10px] px-1.5 py-0.5 rounded-full font-bold">靜止待命</span>
                    </h1>
                    <p id="date-display" class="text-[11px] text-slate-500 font-medium">載入時間中...</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button id="btn-recenter" title="回到我的位置" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition shadow-sm active:scale-95">
                    <i class="fa-solid fa-crosshairs text-base text-emerald-600"></i>
                </button>
                <button id="btn-settings" title="設定" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition shadow-sm active:scale-95">
                    <i class="fa-solid fa-sliders text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 今日統計數據欄 -->
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center justify-around pointer-events-auto text-center shadow-md">
            <div>
                <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">今日里程</p>
                <p class="text-base font-black text-emerald-600"><span id="stat-distance">0.00</span> <span class="text-xs font-normal">km</span></p>
            </div>
            <div class="w-[1px] h-6 bg-slate-200"></div>
            <div>
                <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">經過時間</p>
                <p class="text-base font-black text-slate-700" id="stat-time">00:00:00</p>
            </div>
            <div class="w-[1px] h-6 bg-slate-200"></div>
            <div>
                <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">平均時速</p>
                <p class="text-base font-black text-slate-700"><span id="stat-speed">0.0</span> <span class="text-xs font-normal">km/h</span></p>
            </div>
        </div>
    </div>

    <!-- 右下角快速選單 -->
    <div class="fixed bottom-6 right-4 z-20 flex flex-col space-y-3 pointer-events-auto">
        <button id="btn-history" class="w-12 h-12 rounded-2xl bg-white text-emerald-600 shadow-xl border border-emerald-100 flex flex-col items-center justify-center transition active:scale-95">
            <i class="fa-solid fa-calendar-day text-base"></i>
            <span class="text-[9px] font-bold mt-0.5">歷史</span>
        </button>
        <button id="btn-demo" class="w-12 h-12 rounded-2xl bg-emerald-500 text-white shadow-xl shadow-emerald-500/30 flex flex-col items-center justify-center transition active:scale-95">
            <i class="fa-solid fa-person-walking text-base"></i>
            <span class="text-[9px] font-bold mt-0.5">模擬</span>
        </button>
    </div>

    <!-- Toast 通知條 -->
    <div id="toast" class="fixed top-28 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4">
        <div class="glass-panel px-4 py-2 rounded-full text-xs font-bold text-slate-800 flex items-center space-x-2 shadow-xl border border-emerald-500/30 bg-white/95">
            <span id="toast-icon"><i class="fa-solid fa-circle-check text-emerald-500"></i></span>
            <span id="toast-msg">定位更新中</span>
        </div>
    </div>

    <!-- 設定 Modal Drawer -->
    <div id="modal-settings" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs" id="close-settings-bg"></div>
        <div class="absolute bottom-0 left-0 right-0 glass-panel rounded-t-3xl p-5 border-t border-white/50 max-h-[88vh] overflow-y-auto transform transition-transform duration-300">
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-4"></div>
            <h2 class="text-base font-black text-slate-800 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-sliders text-emerald-500"></i>
                <span>定位與地圖參數設定</span>
            </h2>

            <!-- GPS 敏感度建議參數選單 -->
            <div class="mb-5 bg-white/60 p-3.5 rounded-2xl border border-slate-200/80 shadow-xs">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-extrabold text-slate-700 flex items-center space-x-1">
                        <i class="fa-solid fa-gauge-high text-emerald-600"></i>
                        <span>GPS 記錄敏感度 (動態過濾)</span>
                    </label>
                    <span id="badge-sensitivity" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-700">中 (5m - 推薦)</span>
                </div>
                
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button type="button" onclick="setSensitivity('high')" id="sens-btn-high" class="p-2 rounded-xl border text-center transition">
                        <div class="text-xs font-bold">高敏感</div>
                        <div class="text-[9px] opacity-75">2 公尺</div>
                    </button>
                    <button type="button" onclick="setSensitivity('medium')" id="sens-btn-medium" class="p-2 rounded-xl border text-center transition">
                        <div class="text-xs font-bold">中等 (推薦)</div>
                        <div class="text-[9px] opacity-75">5 公尺</div>
                    </button>
                    <button type="button" onclick="setSensitivity('low')" id="sens-btn-low" class="p-2 rounded-xl border text-center transition">
                        <div class="text-xs font-bold">低敏感</div>
                        <div class="text-[9px] opacity-75">10 公尺</div>
                    </button>
                </div>
                <p id="sensitivity-desc" class="text-[10px] text-slate-500 leading-relaxed">
                    💡 <b>建議參數：</b>標準日常散步選「中等（5米）」，可完美防範靜止或室內時的 GPS 漂移虛爆里程。
                </p>
            </div>

            <!-- 足跡點擊檢測半徑 -->
            <div class="mb-5 bg-white/60 p-3.5 rounded-2xl border border-slate-200/80 shadow-xs">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-extrabold text-slate-700 flex items-center space-x-1">
                        <i class="fa-solid fa-bullseye text-emerald-600"></i>
                        <span>商圈 Session 造訪檢測半徑</span>
                    </label>
                    <span id="badge-radius" class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-100 text-slate-600">50 公尺</span>
                </div>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button type="button" onclick="setDetectionRadius(30)" id="rad-btn-30" class="p-2 rounded-xl border text-center text-xs font-bold">30 米 (街區)</button>
                    <button type="button" onclick="setDetectionRadius(50)" id="rad-btn-50" class="p-2 rounded-xl border text-center text-xs font-bold">50 米 (推薦)</button>
                    <button type="button" onclick="setDetectionRadius(80)" id="rad-btn-80" class="p-2 rounded-xl border text-center text-xs font-bold">80 米 (大型園區)</button>
                </div>
                <p class="text-[10px] text-slate-500 leading-relaxed">
                    🧠 <b>時空 Session 機制：</b>停留 $>3$ 分鐘採計 1 次造訪；逛街 1 小時內不重複算；離場 $>15$ 分鐘後重返才算第 2 次。
                </p>
            </div>

            <!-- 地圖樣式選單 -->
            <div class="mb-5">
                <label class="block text-xs font-bold text-slate-500 mb-2">地圖風格</label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="setMapStyle('googleLight')" class="p-2.5 rounded-xl border border-slate-200 flex items-center space-x-2 text-xs font-bold bg-white shadow-sm hover:border-emerald-500 active:scale-98">
                        <span class="w-4 h-4 rounded-full bg-amber-200 border border-amber-400"></span>
                        <span>Google 淺色 (推薦)</span>
                    </button>
                    <button onclick="setMapStyle('dark')" class="p-2.5 rounded-xl border border-slate-200 flex items-center space-x-2 text-xs font-bold bg-slate-800 text-white shadow-sm hover:border-emerald-500 active:scale-98">
                        <span class="w-4 h-4 rounded-full bg-slate-900 border border-emerald-400"></span>
                        <span>暗黑夜間模式</span>
                    </button>
                    <button onclick="setMapStyle('street')" class="p-2.5 rounded-xl border border-slate-200 flex items-center space-x-2 text-xs font-bold bg-white shadow-sm hover:border-emerald-500 active:scale-98">
                        <span class="w-4 h-4 rounded-full bg-emerald-100 border border-emerald-400"></span>
                        <span>標準街景圖</span>
                    </button>
                    <button onclick="setMapStyle('satellite')" class="p-2.5 rounded-xl border border-slate-200 flex items-center space-x-2 text-xs font-bold bg-white shadow-sm hover:border-emerald-500 active:scale-98">
                        <span class="w-4 h-4 rounded-full bg-blue-900 border border-blue-400"></span>
                        <span>衛星地圖</span>
                    </button>
                </div>
            </div>

            <!-- 足跡粗細 -->
            <div class="mb-5">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-bold text-slate-500">足跡線條粗細</label>
                    <span id="val-linewidth" class="text-xs font-bold text-emerald-600">18 px</span>
                </div>
                <input type="range" id="input-linewidth" min="8" max="36" value="18" class="w-full accent-emerald-500 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- 模擬跨日測試 -->
            <div class="mb-5 pt-3 border-t border-slate-200/80">
                <button id="btn-sim-nextday" class="w-full py-2.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-moon text-emerald-600"></i>
                    <span>🌙 模擬跨日（測試隔日數據歸檔與足跡保留）</span>
                </button>
            </div>

            <div class="pt-3 border-t border-slate-200/80 flex space-x-2">
                <button id="btn-export-gpx" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-file-export"></i>
                    <span>匯出 GPX 軌跡</span>
                </button>
                <button id="btn-clear-all" class="py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition">
                    清除歷史
                </button>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄 Modal -->
    <div id="modal-history" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-xs" id="close-history-bg"></div>
        <div class="absolute bottom-0 left-0 right-0 glass-panel rounded-t-3xl p-5 border-t border-white/50 max-h-[75vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-4"></div>
            <h2 class="text-base font-black text-slate-800 mb-2 flex items-center space-x-2">
                <i class="fa-solid fa-clock-rotate-left text-emerald-500"></i>
                <span>跨日自動歸檔紀錄</span>
            </h2>
            <p class="text-xs text-slate-500 mb-4">每日午夜自動歸檔數據，走過的綠色足跡永久留存！</p>
            <div id="history-list-container" class="space-y-2.5 max-h-[50vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <!-- PWA 安裝提醒 Banner -->
    <div id="pwa-install-banner" class="fixed bottom-24 left-4 right-4 z-30 hidden">
        <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between border border-emerald-500/40 bg-emerald-950/80 text-white shadow-2xl backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-white text-lg">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div>
                    <p class="font-bold text-xs text-emerald-300">安裝為手機 App</p>
                    <p class="text-[10px] text-slate-200">加到主畫面，享全螢幕與即時同步</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-pwa-dismiss" class="text-xs text-slate-400 px-2 py-1">忽略</button>
                <button id="btn-pwa-install" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl transition shadow">
                    安裝
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let userMarker = null;
        let accuracyCircle = null;
        let watchPositionId = null;

        let todayPath = [];
        let allTimePoints = [];
        let historyData = [];

        let polylineOuter = null; 
        let polylineInner = null; 
        let persistentHistoryGroup = null;

        let totalDistance = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let wakeLock = null;
        let deferredPrompt = null;

        let isDemoWalking = false;
        let isMoving = false;
        let lastMoveTime = 0;
        let simulatedDaysOffset = 0;

        // 全局敏感度與設定參數
        let settings = {
            style: 'googleLight',
            lineWidth: 18,
            sensitivity: 'medium',   // 'high' (2m), 'medium' (5m), 'low' (10m)
            minDistance: 0.005,      // km (預設 5 米過濾防漂移)
            maxAccuracyFilter: 35,   // 忽略精確度大於 35 米的無效訊號
            detectionRadius: 50      // 點擊檢測預設 50 米 (時空 Session 聚類)
        };

        const MAP_TILES = {
            googleLight: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', 
            street: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        };
        let currentTileLayer = null;

        window.onload = function() {
            initMap();
            loadAllStoredData();
            checkDailyRollover();
            startGPSWatch();
            setupEventListeners();
            requestWakeLock();
            setupPWAInstallPrompt();
            updateSensitivityUI();

            // 每秒觸發計時器與動態檢測
            timerInterval = setInterval(() => {
                const now = getSimulatedNow();
                
                if (isDemoWalking || (lastMoveTime > 0 && (now - lastMoveTime) < 5000)) {
                    isMoving = true;
                    elapsedTime++;
                } else {
                    isMoving = false;
                }

                const statusBadge = document.getElementById('gps-status-badge');
                const pulseInd = document.getElementById('gps-pulse-indicator');
                if (statusBadge && pulseInd) {
                    if (isMoving) {
                        statusBadge.innerText = '移動紀錄中';
                        statusBadge.className = 'bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded-full font-bold';
                        pulseInd.className = 'w-3.5 h-3.5 bg-emerald-500 rounded-full animate-ping block';
                    } else {
                        statusBadge.innerText = '靜止待命';
                        statusBadge.className = 'bg-slate-200 text-slate-600 text-[10px] px-1.5 py-0.5 rounded-full font-bold';
                        pulseInd.className = 'w-3.5 h-3.5 bg-slate-400 rounded-full block';
                    }
                }

                updateStatsDisplay();
                checkDailyRollover();
            }, 1000);

            const simDateObj = new Date(getSimulatedNow());
            const dateStr = simDateObj.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
            const dateEl = document.getElementById('date-display');
            if (dateEl) dateEl.innerText = dateStr;
        };

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([25.0330, 121.5654], 16);

            currentTileLayer = L.tileLayer(MAP_TILES.googleLight, {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            persistentHistoryGroup = L.layerGroup().addTo(map);

            polylineOuter = L.polyline([], {
                color: '#15803d',
                weight: settings.lineWidth + 6,
                opacity: 0.35,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            polylineInner = L.polyline([], {
                color: '#22c55e',
                weight: settings.lineWidth,
                opacity: 0.9,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            map.on('click', onMapClick);
        }

        function startGPSWatch() {
            if (!navigator.geolocation) {
                showToast('您的裝置不支援 GPS 定位', 'fa-solid fa-triangle-exclamation');
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 2000
            };

            watchPositionId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const accuracy = pos.coords.accuracy;
                    const speed = pos.coords.speed;
                    handleNewLocation(lat, lng, accuracy, speed);
                },
                (err) => {
                    console.warn('GPS Error:', err.message);
                },
                options
            );
        }

        function handleNewLocation(lat, lng, accuracy, speed) {
            const newPt = [lat, lng];
            const now = getSimulatedNow();
            
            // 更新定位點圖示
            if (!userMarker) {
                const gmapIcon = L.divIcon({
                    className: 'custom-gmap-marker',
                    html: `
                        <div class="gmap-user-container">
                            <div class="gmap-user-dot"></div>
                        </div>
                    `,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                userMarker = L.marker(newPt, { icon: gmapIcon }).addTo(map);
                map.panTo(newPt);
            } else {
                userMarker.setLatLng(newPt);
            }

            // 更新精確度圓圈
            if (accuracy) {
                if (!accuracyCircle) {
                    accuracyCircle = L.circle(newPt, {
                        radius: accuracy,
                        color: '#22c55e',
                        weight: 1,
                        opacity: 0.3,
                        fillColor: '#22c55e',
                        fillOpacity: 0.1
                    }).addTo(map);
                } else {
                    accuracyCircle.setLatLng(newPt);
                    accuracyCircle.setRadius(accuracy);
                }
            }

            // 雜訊防飄移防護：若訊號太差 (>35米誤差) 則忽略不記錄為足跡，防止產生巨大突波線條
            if (accuracy && accuracy > settings.maxAccuracyFilter && !isDemoWalking) {
                return;
            }

            let distanceMoved = 0;
            if (todayPath.length > 0) {
                const lastPt = todayPath[todayPath.length - 1];
                distanceMoved = calculateDistance(lastPt.lat, lastPt.lng, lat, lng);
            }

            // 依據設定的 minDistance (2m/5m/10m) 判斷是否為有效位移
            const hasMoved = (speed && speed > 0.3) || (distanceMoved >= settings.minDistance);

            if (hasMoved || isDemoWalking) {
                lastMoveTime = now;
                isMoving = true;
            }

            if (todayPath.length > 0) {
                // 只有移動距離大於敏感度閥值才記錄，完全防止站立時的 GPS 漂移
                if (distanceMoved >= settings.minDistance) {
                    totalDistance += distanceMoved;
                    todayPath.push({ lat, lng, timestamp: now });
                    allTimePoints.push({ lat, lng, timestamp: now });
                    appendPathPoint(lat, lng);
                    saveTodayData();
                }
            } else {
                todayPath.push({ lat, lng, timestamp: now });
                allTimePoints.push({ lat, lng, timestamp: now });
                appendPathPoint(lat, lng);
                saveTodayData();
            }

            updateStatsDisplay();
        }

        function appendPathPoint(lat, lng) {

        function getVisitsAt(clickedLat, clickedLng, radiusMeters = 50) {
            if (!allTimePoints || allTimePoints.length === 0) return [];

            const radiusKm = radiusMeters / 1000;
            const MIN_DWELL_MS = 3 * 60 * 1000;       // 3 分鐘有效停留門檻
            const EXIT_TIMEOUT_MS = 15 * 60 * 1000;   // 15 分鐘離場過期門檻

            // 1. 篩選在半徑內的所有軌跡點
            const pointsInRadius = [];
            for (let i = 0; i < allTimePoints.length; i++) {
                const pt = allTimePoints[i];
                const ptLat = pt.lat !== undefined ? pt.lat : (Array.isArray(pt) ? pt[0] : 0);
                const ptLng = pt.lng !== undefined ? pt.lng : (Array.isArray(pt) ? pt[1] : 0);
                const ptTime = pt.timestamp !== undefined ? pt.timestamp : (Array.isArray(pt) ? (pt[2] || Date.now()) : Date.now());

                const dist = calculateDistance(clickedLat, clickedLng, ptLat, ptLng);
                if (dist <= radiusKm) {
                    pointsInRadius.push({ lat: ptLat, lng: ptLng, timestamp: ptTime });
                }
            }

            if (pointsInRadius.length === 0) return [];

            // 按時間從小到大排序
            pointsInRadius.sort((a, b) => a.timestamp - b.timestamp);

            // 2. 時空聚類切分 Session
            const sessions = [];
            let currentSession = {
                startTime: pointsInRadius[0].timestamp,
                endTime: pointsInRadius[0].timestamp,
                count: 1
            };

            for (let i = 1; i < pointsInRadius.length; i++) {
                const pt = pointsInRadius[i];
                const timeDiff = pt.timestamp - currentSession.endTime;

                if (timeDiff <= EXIT_TIMEOUT_MS) {
                    // 未超過 15 分鐘離場門檻，算在同一次 Session (逛街 1 小時不會被拆分)
                    currentSession.endTime = pt.timestamp;
                    currentSession.count++;
                } else {
                    // 超過 15 分鐘未出現，前一個 Session 結算
                    if ((currentSession.endTime - currentSession.startTime >= MIN_DWELL_MS) || currentSession.count >= 3) {
                        sessions.push(currentSession);
                    }
                    currentSession = {
                        startTime: pt.timestamp,
                        endTime: pt.timestamp,
                        count: 1
                    };
                }
            }

            // 處理最後一個 Session
            if ((currentSession.endTime - currentSession.startTime >= MIN_DWELL_MS) || currentSession.count >= 3) {
                sessions.push(currentSession);
            }

            return sessions.reverse(); // 最新 Session 排最上方
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDateTime(ts) {
            const d = new Date(ts);
            const yyyy = d.getFullYear();
            const mm = (d.getMonth() + 1).toString().padStart(2, '0');
            const dd = d.getDate().toString().padStart(2, '0');
            const hh = d.getHours().toString().padStart(2, '0');
            const min = d.getMinutes().toString().padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        function formatTime(sec) {
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function getSimulatedNow() {
            return Date.now() + (simulatedDaysOffset * 86400000);
        }

        function getTodayDateStr() {
            const d = new Date(getSimulatedNow());
            return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
        }

        function showToast(msg, iconClass = 'fa-solid fa-info-circle') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            if (toastMsg) toastMsg.innerText = msg;
            if (toastIcon) toastIcon.innerHTML = `<i class="${iconClass} text-emerald-500"></i>`;
            
            if (toast) {
                toast.classList.remove('opacity-0', '-translate-y-4');
                setTimeout(() => {
                    toast.classList.add('opacity-0', '-translate-y-4');
                }, 2500);
            }
        }

        function exportGPX() {
            if (allTimePoints.length === 0) {
                showToast('目前沒有足跡點位可供匯出', 'fa-solid fa-triangle-exclamation');
                return;
            }
            let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GreenFootprintApp">\n<trk><name>My Green Footprints</name><trkseg>\n`;
            allTimePoints.forEach(pt => {
                const lat = Array.isArray(pt) ? pt[0] : pt.lat;
                const lon = Array.isArray(pt) ? pt[1] : pt.lng;
                gpx += `<trkpt lat="${lat}" lon="${lon}"></trkpt>\n`;
            });
            gpx += `</trkseg></trk>\n</gpx>`;

            const blob = new Blob([gpx], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `green-footprint-${getTodayDateStr()}.gpx`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已成功下載 GPX 軌跡檔案', 'fa-solid fa-file-arrow-down');
        }
    </script>
</body>
</html>
